name: Generic injector identity and Plus source audit
on:
  push:
    branches: ['fix/generic-name-plus24-audit']
    paths: ['.github/workflows/generic-name-plus24-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Joshua-1248/GoldenEye-007-Plus
          ref: c42295ba400386aac4140957b6f7fa9e53ab911d
          path: plus-reference
          persist-credentials: false
      - name: Preserve source and audit boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-out
          git rev-parse HEAD > audit-out/source-commit.txt
          git -C plus-reference show -s --format='%H%n%cI%n%s' HEAD > audit-out/upstream-revision.txt
          git archive --format=zip --output=audit-out/Mouse-Injector-Generic-Name-Source.zip HEAD
          python3 - <<'PY'
          from pathlib import Path
          import json
          out=Path('audit-out')
          audit={
              'uploaded_rom':'goldeneye_007_plus_2.4.z64',
              'uploaded_rom_read':False,
              'reason':'Conversation execution runtime returned ClientError before any file reads. Do not claim a ROM hash or ROM-specific test.',
              'upstream_commit':'c42295ba400386aac4140957b6f7fa9e53ab911d',
              'last_confirmed_base_commit':'342d01ec5c1cb6ac15e098f8294943e554590cc3',
              'source_findings':[
                  'GE_FindMenuMaxPage depends on a specific constructor instruction layout; fallback is 27.',
                  'Optional Level Modifiers support depends on mapmaker.page and relative positions 1,2,3.',
                  'Level Modifiers row counts and geometry are static, not taken from a ROM-provided UI description.',
                  'DEVICE injection is gated on GAME_Status; unrecognised layouts have no independent native-controller fallback.'
              ],
              'menu_fix_implemented':False,
              'needed_verification':'Resolve the actual uploaded 2.4 image, then test every menu route, hover rectangle, scrolling row, transition, click and Back action. Preserve gameplay 1.2, E/R separation, editor camera and emulator fixes.',
              'release_modified':False
          }
          (out/'menu-audit-status.json').write_text(json.dumps(audit,indent=2)+'\n')
          print(json.dumps(audit,indent=2))
          PY
      - name: Install Win32 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Build and verify generic injector labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p obj
          make -j2 CC=i686-w64-mingw32-gcc WINDRES=i686-w64-mingw32-windres PYTHON=python3 2>&1 | tee audit-out/build.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          s=Path('maindll.c').read_text()
          assert 'FreeFly' not in s and 'Free-Fly' not in s
          assert 'Mouse Injector for GE/PD ' in s
          rc=Path('ui/ui.rc').read_text()
          assert 'CAPTION "Mouse Injector - Input Settings"' in rc
          game=Path('games/goldeneye.c').read_text()
          assert '0xBFC90FDAU' in game and '0x3FC90FDAU' in game
          dll=Path('Mouse_Injector.dll').read_bytes()
          assert b'Mouse Injector for GE/PD ' in dll
          assert b'Mouse Injector - FreeFly' not in dll
          assert b' FreeFly-F3 (Build:' not in dll
          assert b'Mouse Injector for GE/PD V2.3 FreeFly' not in dll
          assert 'Mouse Injector - Input Settings'.encode('utf-16-le') in dll
          out=Path('audit-out')
          report={'dll_sha256':hashlib.sha256(dll).hexdigest(),'identity_checks_pass':True,'input_settings_title':'Mouse Injector - Input Settings','camera_binary32_fix_retained':True,'menu_2_4_verified':False,'interactive_emulator_test':False}
          (out/'name-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          with zipfile.ZipFile(out/'Mouse-Injector-Generic-Name-Only.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('plugin/Mouse_Injector.dll',dll)
              z.writestr('README.txt','Generic-name-only build. This is NOT a Plus 2.4 menu compatibility fix. Replaces only plugin/Mouse_Injector.dll. Existing executable, settings and ROMs are unchanged.\n')
              z.writestr('SHA256SUMS.txt',report['dll_sha256']+'  plugin/Mouse_Injector.dll\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-name-and-menu-audit
          path: audit-out/
          retention-days: 14
          if-no-files-found: error
